# encalertd 配置（buildroot 模式安装到 /etc/encalertd.conf）
# 所有键均可省略，省略时使用代码内默认值（见各键注释）。
#
# 优先级：本文件 > 环境变量 ENC_MQTT_PASS > /root/encoder/config.sh 继承

# ===== 基础 =====
# interval_sec=10                     # 主循环节奏上限
# dedup_sec=600                       # 同码去重窗口（warn/error/fatal）
spool_dir=/var/lib/encalertd          # seq/msgid/dedup/spool 落盘目录
log_file=/tmp/encalertd.log           # 空串=仅 stdout/stderr
# log_verbose=0                       # 1=调试日志

# ===== 目录 =====
state_dir=/root/encoder/runtime/state  # bash 维护的状态文件目录
actions_dir=/root/encoder/actions      # C 调起的恢复动作脚本目录
action_timeout_sec=30                  # 单个 action 超时

# ===== MQTT =====
# host/port/user/pass 默认从 config.sh 继承；此处留空即可覆盖默认值。
# mqtt_pass 建议只通过 ENC_MQTT_PASS 环境变量注入，不落明文。
mqtt_qos=1                             # 自研客户端固定 QoS1+spool 必达

# ===== 阈值 =====
low_batt_mv=3200
low_batt_pct=3
low_batt_confirm=3                     # 低电确认轮数（触发 5001 关机）
sd_warn_pct=95                         # SD 占用率告警阈 (4003)
record_min_free_mb=5120                # 录像盘最低空闲 MB (4003/空间清理)，5GB 底线
temp_warn_mc=85000                     # SoC 温度告警 (8101)，毫摄氏度
temp_err_mc=95000                      # 超过则 desc 标记 CRITICAL
load_factor_warn=3.0                   # loadavg/(核数) 上限 (8102)
mem_avail_min_kb=8192                  # MemAvailable 下限 kB (8103)

charge_window_sec=300                  # 充电故障检测窗口
charge_drop_pct=2                      # 窗口内电量下降 ≥2% → 2001
charge_drop_mv=80                      # 或电压下降 ≥80mV → 2001
                                       # （充电尾段 4164mV 满电附近实测波动 ~74-71mV，
                                       #   30mV 会误报，实测后从 30 上调）

# ===== WiFi 原生检测（L1-L3 自动重连）=====
# wifi_iface=wlan0                      # 监测的无线接口名

# ===== 硬件自检（hw_watch 9101/9102，C 内置探测）=====
# enable_hw=true                        # 硬件自检开关
# hw_interval_sec=3600                  # 自检周期，默认 1h/次；
#                                       # 稳定后建议调稀到 86400（1 天/次）
# 探测项：vi 帧率 / SDK 节点 / media-mem / imx347 ini / I2C(0x20,0x36) /
#         acodec / wlan0；全量人工版见 /usr/sbin/hw_probe.sh --manual

# ===== 进程监控（6103 死亡 + 6104 风暴）=====
# 监控清单：name[:pidfile[:cmdpat]] 逗号分隔。pidfile（显式或
#   <state_dir>/<name>.pid）命中仅作 fast-path，一律做 /proc 身份复核
#   （防 pid 回收误判/漏报），复核不过回落 comm 精确匹配 → cmdline 子串。
# 2026-09-01 简化：默认纯名字清单（/proc comm 为权威源，无陈旧态）=
#   majestic + encodermain + ipc_server；bash 家族名仅现场显式配置才走 cmdpat。
# monitor_procs=majestic,encodermain,ipc_server
# storm_window_sec=900                  # 重启风暴统计窗口
# storm_max_restarts=3                  # 窗口内拉起 ≥N 次升级 6104 fatal + reboot
# crash_dir=/mnt/mmcblk0p1/logs/crash   # 崩溃快照持久目录（SD 卡）

# ===== 模块开关（默认全 true，可按需裁剪）=====
# enable_wifi=true       # WiFi 断线检测/自动重连(1001/1002) + cron 兜底(6001)
# enable_battery=true    # 低电/感知失效/充电故障
# enable_sdcard=true     # SD 三态 + 录像清理任务
# enable_sysres=true     # 温度/负载/内存
# enable_process=true    # 进程存活监控(6103/6104)
# enable_stream=true     # 推流健康 + HUP 自愈
